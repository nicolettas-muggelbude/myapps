[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myapps"
version = "1.0.6"
description = "Tool zum Auflisten und Verwalten installierter Linux-Anwendungen"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPLv3"}
authors = [
    {name = "MyApps Contributors"}
]
keywords = ["linux", "package-manager", "gui", "desktop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

dependencies = [
    # PyGObject wird NICHT via pip installiert!
    # Muss als System-Paket kommen:
    #   Ubuntu/Debian: sudo apt install python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1
    #   Fedora:        sudo dnf install python3-gobject gtk4 libadwaita
    #   Arch:          sudo pacman -S python-gobject gtk4 libadwaita
    "Pillow>=10.0.0",  # Icon Loading (kann via pip installiert werden)
]

[project.optional-dependencies]
legacy = [
    "ttkbootstrap>=1.10.1",  # Fallback für alte tkinter GUI
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/nicolettas-muggelbude/myapps"
"Bug Tracker" = "https://github.com/nicolettas-muggelbude/myapps/issues"

[project.scripts]
myapps = "myapps.main:main"

[tool.setuptools]
packages = ["myapps"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
myapps = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
